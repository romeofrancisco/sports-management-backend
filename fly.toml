# fly.toml app configuration file generated for sports-management-backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sports-management"
primary_region = "sin"  # Singapore region (closest to Philippines)

[build]
  [build.args]
    PYTHON_VERSION = "3.12"

[env]
  PORT = "8000"
  DJANGO_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"  # Increased CPU for better performance with AI features
  memory_mb = 256  # Increased memory for Django app with channels and AI processing

[deploy]
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear'"
