<!DOCTYPE html>
<html>
<head>
    <title>Team Chat Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-log { height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        #chat-message-input { width: 70%; }
        #chat-message-submit { width: 25%; }
        .message { margin-bottom: 10px; padding: 5px; border-radius: 5px; }
        .admin { background-color: #ffecb3; }
        .coach { background-color: #e1f5fe; }
        .player { background-color: #f3e5f5; }
    </style>
</head>
<body>
    <h1>Team Chat Test</h1>
    <div id="chat-log"></div>
    <input id="chat-message-input" type="text" placeholder="Type your message..." />
    <input id="chat-message-submit" type="button" value="Send" />

    <script>
        // You'll need to replace TEAM_ID with actual team ID
        const teamId = 1; // Change this to test different teams
        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/chat/team/' + teamId + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const chatLog = document.querySelector('#chat-log');
            
            if (data.type === 'chat_message') {
                const messageElement = document.createElement('div');
                messageElement.className = 'message ' + data.sender_role.toLowerCase();
                messageElement.innerHTML = `
                    <strong>${data.sender_name} (${data.sender_role}):</strong> ${data.message}
                    <small style="color: gray; display: block;">${new Date(data.timestamp).toLocaleTimeString()}</small>
                `;
                chatLog.appendChild(messageElement);
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };

        document.querySelector('#chat-message-input').focus();
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.keyCode === 13) {  // enter, return
                document.querySelector('#chat-message-submit').click();
            }
        };

        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value;
            if (message.trim()) {
                chatSocket.send(JSON.stringify({
                    'message': message
                }));
                messageInputDom.value = '';
            }
        };
    </script>
</body>
</html>
